<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8" />
<title>Nicky's Festive Quiz</title>
<style>
body {margin:0;padding:20px;font-family:Arial,sans-serif;background:#fafafa;}
.container {max-width:600px;margin:auto;}
h1{text-align:center;}
.question-block{background:white;padding:20px;margin:15px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.options label{display:block;padding:10px;margin:5px 0;background:#eee;border-radius:6px;cursor:pointer;}
.options input{margin-right:10px;}
button{padding:12px 20px;font-size:16px;border:none;border-radius:8px;background:#008cff;color:white;cursor:pointer;margin-top:10px;width:100%;}
.correct-answer{color:green;font-weight:bold;}
.wrong-answer{color:red;font-weight:bold;}
</style>
</head>
<body>
<div class="container">
<h1>Nicky's Festive Quiz</h1>
<div id="quiz"></div>
<div id="result" style="display:none;text-align:left;"></div>
</div>
<script>
const questions = [
  // Premier League Football - Hard
  {question:"Which Premier League club suffered the largest margin defeat in a single match?", answers:["Sunderland","Portsmouth","Aston Villa","Derby County"], correct:3},
  {question:"Who is the only player to have scored in every Premier League season from 1992 to 2006?", answers:["Ryan Giggs","Alan Shearer","Thierry Henry","Frank Lampard"], correct:0},
  {question:"Which manager went the longest unbeaten in his first 100 Premier League games?", answers:["Arsène Wenger","Sir Alex Ferguson","Pep Guardiola","José Mourinho"], correct:0},
  {question:"Which club has the record for most relegations from the Premier League?", answers:["West Bromwich Albion","Sunderland","Norwich City","Crystal Palace"], correct:1},
  {question:"Who is the fastest player to reach 100 Premier League goals?", answers:["Sergio Agüero","Alan Shearer","Harry Kane","Robin van Persie"], correct:0},
  {question:"Which Premier League goalkeeper has scored more than once?", answers:["Peter Schmeichel","Brad Friedel","Asmir Begović","Tim Howard"], correct:2},
  {question:"Which club holds the record for most points in a single Premier League season?", answers:["Manchester City","Chelsea","Liverpool","Manchester United"], correct:0},
  {question:"Who was the first non-British player to captain a Premier League-winning team?", answers:["Vincent Kompany","Roy Keane","Patrick Vieira","Eric Cantona"], correct:2},
  {question:"Which player has the record for most assists in a single Premier League season?", answers:["Kevin De Bruyne","Cesc Fàbregas","Ryan Giggs","Mesut Özil"], correct:0},
  {question:"Which Premier League team scored the fewest goals in a season?", answers:["Derby County","Sunderland","Wimbledon","Swindon Town"], correct:0},
  {question:"Which manager has been sacked the most times in Premier League history?", answers:["Sam Allardyce","Harry Redknapp","Chris Coleman","Mark Hughes"], correct:0},
  {question:"Who is the youngest goalscorer in Premier League history?", answers:["James Vaughan","Wayne Rooney","Michael Owen","Theo Walcott"], correct:0},
  {question:"Which team holds the record for the longest losing streak in Premier League history?", answers:["Derby County","Sunderland","Hull City","Norwich City"], correct:0},
  {question:"Which player scored directly from a corner in Premier League history first?", answers:["Thierry Henry","Owen Hargreaves","Wayne Rooney","David Beckham"], correct:1},
  {question:"Which club has the record for most consecutive away wins in Premier League?", answers:["Manchester City","Chelsea","Arsenal","Liverpool"], correct:0},

  // 1960s Music - Hard
  {question:"Which band released the experimental album 'The Piper at the Gates of Dawn'?", answers:["Pink Floyd","The Beatles","The Kinks","The Rolling Stones"], correct:0},
  {question:"Which 1960s jazz musician influenced The Beatles’ 'Tomorrow Never Knows'?", answers:["John Coltrane","Miles Davis","Ornette Coleman","Charles Mingus"], correct:0},
  {question:"Which 1960s band was known for pioneering feedback and distortion in rock guitar?", answers:["The Yardbirds","The Who","The Rolling Stones","The Kinks"], correct:0},
  {question:"Which 1960s singer's stage act included a full orchestral accompaniment and mime?", answers:["Scott Walker","Elvis Presley","Tom Jones","Roy Orbison"], correct:0},
  {question:"Which British Invasion band featured Jeff Beck before Jimmy Page?", answers:["The Yardbirds","The Kinks","The Who","The Rolling Stones"], correct:0},
  {question:"Which 1960s psychedelic band released 'Arnold Layne'?", answers:["Pink Floyd","The Doors","The Byrds","Cream"], correct:0},
  {question:"Which 1960s Motown act recorded 'Ain't No Mountain High Enough'?", answers:["Marvin Gaye & Tammi Terrell","The Supremes","Four Tops","The Temptations"], correct:0},
  {question:"Which 1960s folk artist recorded 'The Sound of Silence'?", answers:["Simon & Garfunkel","Bob Dylan","Peter, Paul and Mary","Joan Baez"], correct:0},
  {question:"Which band was behind the 1967 hit 'She’s Not There'?", answers:["The Zombies","The Animals","The Rolling Stones","The Kinks"], correct:0},
  {question:"Who wrote the 1960s hit 'For What It’s Worth'?", answers:["Stephen Stills","Bob Dylan","Barry McGuire","Buffalo Springfield"], correct:3},
  {question:"Which 1960s British band released 'Days of Future Passed'?", answers:["The Moody Blues","The Beatles","The Kinks","Procol Harum"], correct:0},
  {question:"Which 1960s band first used the Mellotron extensively?", answers:["The Beatles","The Moody Blues","Pink Floyd","The Zombies"], correct:1},
  {question:"Which 1960s rock artist was nicknamed 'The Lizard King'?", answers:["Jim Morrison","Jimi Hendrix","Eric Clapton","Mick Jagger"], correct:0},
  {question:"Which 1960s singer performed 'I Put a Spell on You'?", answers:["Screamin’ Jay Hawkins","Nina Simone","Sam Cooke","Ray Charles"], correct:0},
  {question:"Which 1960s album by The Rolling Stones was originally banned in some countries for lyrics?", answers:["Beggars Banquet","Out of Our Heads","Aftermath","Their Satanic Majesties Request"], correct:0},

  // 1980s Music - Hard
  {question:"Which 1980s synth band was known for the album 'Dare'?", answers:["The Human League","OMD","Depeche Mode","New Order"], correct:0},
  {question:"Which 1980s band’s album 'Remain in Light' fused rock and funk with African polyrhythms?", answers:["Talking Heads","Duran Duran","Tears for Fears","Simple Minds"], correct:0},
  {question:"Which 1980s guitarist was a member of both Queen and The Cross?", answers:["Brian May","Slash","David Gilmour","Mark Knopfler"], correct:0},
  {question:"Which 1980s singer released the experimental album 'Control'?", answers:["Janet Jackson","Madonna","Cyndi Lauper","Pat Benatar"], correct:0},
  {question:"Which 1980s band incorporated gamelan and world music on 'So'?", answers:["Peter Gabriel","Talking Heads","Simple Minds","Duran Duran"], correct:0},
  {question:"Which 1980s song by Kate Bush reached the US top 10?", answers:["Running Up That Hill","Babooshka","Wuthering Heights","Hounds of Love"], correct:0},
  {question:"Which 1980s band’s song 'Love Vigilantes' features a military motif?", answers:["New Order","The Cure","Depeche Mode","Duran Duran"], correct:0},
  {question:"Which 1980s band recorded 'West End Girls'?", answers:["Pet Shop Boys","Eurythmics","Tears for Fears","Simple Minds"], correct:0},
  {question:"Which 1980s artist’s video 'Take On Me' used rotoscoping animation?", answers:["A-ha","Duran Duran","The Police","Tears for Fears"], correct:0},
  {question:"Which 1980s band released 'The Working Hour' on 'Songs from the Big Chair'?", answers:["Tears for Fears","Simple Minds","Duran Duran","The Police"], correct:0},
  {question:"Which 1980s singer performed 'Bizarre Love Triangle'?", answers:["New Order","Depeche Mode","Erasure","OMD"], correct:0},
  {question:"Which 1980s band was fronted by Boy George?", answers:["Culture Club","Spandau Ballet","A-ha","Duran Duran"], correct:0},
  {question:"Which 1980s album by Prince was known for the Minneapolis sound?", answers:["1999","Purple Rain","Controversy","Around the World in a Day"], correct:0},
  {question:"Which 1980s band fused reggae and pop in 'Red Red Wine'?", answers:["UB40","The Police","Culture Club","Madness"], correct:0},
  {question:"Which 1980s synth-pop duo had hits with 'Only You' and 'Don’t Go'?", answers:["Yazoo","Pet Shop Boys","Erasure","OMD"], correct:0},
  {question:"Which 1980s band released 'Bizarre Love Triangle'?", answers:["New Order","Depeche Mode","A-ha","Tears for Fears"], correct:0},
  {question:"Which 1980s singer recorded 'I Want Candy'?", answers:["Bow Wow Wow","Cyndi Lauper","Madonna","Bananarama"], correct:0},
  {question:"Which 1980s band recorded 'Everybody Wants to Rule the World'?", answers:["Tears for Fears","Duran Duran","Simple Minds","Spandau Ballet"], correct:0},
  {question:"Which 1980s artist had a hit with 'Addicted to Love'?", answers:["Robert Palmer","Phil Collins","Bryan Ferry","Peter Gabriel"], correct:0},
  {question:"Which 1980s band released 'Shout' with the lyric 'These are the things I can do without'?", answers:["Tears for Fears","Duran Duran","Simple Minds","Spandau Ballet"], correct:0},
  {question:"Which 1980s album by Talking Heads included 'Once in a Lifetime'?", answers:["Remain in Light","Speaking in Tongues","Fear of Music","More Songs About Buildings and Food"], correct:0},
  {question:"Which 1980s artist had a hit with 'Owner of a Lonely Heart'?", answers:["Yes","Genesis","Rush","King Crimson"], correct:0},
  {question:"Which 1980s band released 'Obsession'?", answers:["Animotion","Tears for Fears","Duran Duran","Spandau Ballet"], correct:0},
  {question:"Which 1980s singer had a top 10 hit with 'If I Could Turn Back Time'?", answers:["Cher","Madonna","Cyndi Lauper","Whitney Houston"], correct:0},
  {question:"Which 1980s band had a hit with 'Send Me an Angel'?", answers:["Real Life","The Police","Tears for Fears","Duran Duran"], correct:0},
  {question:"Which 1980s band released 'Pale Shelter'?", answers:["Tears for Fears","Simple Minds","Duran Duran","Spandau Ballet"], correct:0},
  {question:"Which 1980s band recorded 'People Are People'?", answers:["Depeche Mode","New Order","OMD","Erasure"], correct:0}
];

function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}

let selectedQuestions=[], current=0, score=0, userAnswers=[];

function pickRandomQuestions(){
  selectedQuestions=shuffle([...questions]).slice(0,12).map(q=>{
    const shuffledAnswers=shuffle([...q.answers]);
    const correctIndex=shuffledAnswers.indexOf(q.answers[q.correct]);
    return {...q, answers:shuffledAnswers, correct:correctIndex};
  });
  userAnswers=[];
}

function showQuestion(){
  if(current>=selectedQuestions.length){
    document.getElementById('quiz').style.display='none';
    const resultDiv=document.getElementById('result');
    resultDiv.style.display='block';
    let resultHTML=`<h2>Quiz Complete!</h2><p>Your score: ${score} / ${selectedQuestions.length}</p><hr>`;
    selectedQuestions.forEach((q,i)=>{
      const userAns=userAnswers[i];
      const correctAns=q.answers[q.correct];
      const ansText=userAns!=null?q.answers[userAns]:'<em>Not answered</em>';
      if(userAns===q.correct){
        resultHTML+=`<p>${i+1}. ${q.question}<br><span class='correct-answer'>Your answer: ${ansText} ✅</span></p>`;
      }else{
        resultHTML+=`<p>${i+1}. ${q.question}<br><span class='wrong-answer'>Your answer: ${ansText} ❌</span><br><span class='correct-answer'>Correct answer: ${correctAns}</span></p>`;
      }
    });
    resultHTML+=`<button onclick='restartQuiz()'>Play Again</button>`;
    resultDiv.innerHTML=resultHTML;
    return;
  }
  const q=selectedQuestions[current];
  const quizDiv=document.getElementById('quiz');
  quizDiv.style.display='block';
  quizDiv.innerHTML=`<div class='question-block'><div class='question'>${current+1}. ${q.question}</div><div class='options'>${q.answers.map((a,i)=>`<label><input type='radio' name='q' value='${i}'>${a}</label>`).join('')}</div><button id='nextBtn'>Next</button></div>`;
  document.getElementById('nextBtn').onclick=()=>{
    const selected=document.querySelector('input[name=q]:checked');
    if(selected){
      const selectedIndex=parseInt(selected.value);
      userAnswers.push(selectedIndex);
      if(selectedIndex===q.correct) score++;
      current++;
      showQuestion();
    }else alert('Please select an answer');
  };
}

function restartQuiz(){current=0;score=0;pickRandomQuestions();document.getElementById('result').style.display='none';showQuestion();}

restartQuiz();
</script>
</body>
</html>
