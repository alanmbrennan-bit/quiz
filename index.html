function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

let selectedQuestions=[];
let current=0;
let score=0;

function pickRandomQuestions(){
  selectedQuestions = shuffle([...questions]).slice(0,12).map(q=>{
    const shuffledAnswers = shuffle([...q.answers]);
    const correctIndex = shuffledAnswers.indexOf(q.answers[q.correct]);
    return {...q, answers:shuffledAnswers, correct:correctIndex};
  });
}

function showQuestion(){
  if(current>=selectedQuestions.length){
    document.getElementById('quiz').style.display='none';
    const resultDiv=document.getElementById('result');
    resultDiv.style.display='block';
    resultDiv.innerHTML=`<h2>Quiz Complete!</h2><p>Your score: ${score} / ${selectedQuestions.length}</p><button onclick='restartQuiz()'>Play Again</button>`;
    return;
  }
  const q=selectedQuestions[current];
  const quizDiv=document.getElementById('quiz');
  quizDiv.innerHTML=`<div class='question-block'>
  <div class='question'>${current+1}. ${q.question}</div>
  <div class='options'>${q.answers.map((a,i)=>`<label><input type='radio' name='q' value='${i}'>${a}</label>`).join('')}</div>
  <button id='nextBtn'>Next</button>
  </div>`;
  document.getElementById('nextBtn').onclick=()=>{
    const selected=document.querySelector('input[name=q]:checked');
    if(selected){
      if(parseInt(selected.value)===q.correct) score++;
      current++;
      showQuestion();
    }else{
      alert('Please select an answer');
    }
  };
}

function restartQuiz(){
  current=0;
  score=0;
  pickRandomQuestions();
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  showQuestion();
}

// Auto-start quiz
restartQuiz();
</script>
</body>
