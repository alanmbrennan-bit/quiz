<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8" />
<title>Nicky's Festive Quiz</title>
<style>
body {margin:0;padding:20px;font-family:Arial,sans-serif;background:#fafafa;}
.container {max-width:600px;margin:auto;}
h1{text-align:center;}
.question-block{background:white;padding:20px;margin:15px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.options label{display:block;padding:10px;margin:5px 0;background:#eee;border-radius:6px;cursor:pointer;}
.options input{margin-right:10px;}
button{padding:12px 20px;font-size:16px;border:none;border-radius:8px;background:#008cff;color:white;cursor:pointer;margin-top:10px;width:100%;}
</style>
</head>
<body>
<div class="container">
<h1>Nicky's Festive Quiz</h1>
<div id="quiz"></div>
<div id="result" style="display:none;text-align:center;"></div>
</div>
<script>
// Hardcoded sample questions - replace with your full 50-question pool
const questions = [
  {question:"Which Premier League club had the lowest points total ever?",answers:["Huddersfield Town","Derby County","Sunderland","Portsmouth"],correct:1},
  {question:"Which player recorded the first perfect hat-trick in the Premier League?",answers:["Jimmy Floyd Hasselbaink","Robbie Fowler","Sergio Agüero","Les Ferdinand"],correct:1},
  {question:"Which 1960s band created one of the first rock concept albums?",answers:["The Pretty Things","The Moody Blues","King Crimson","The Kinks"],correct:0},
  {question:"Which 1980s band was first to use the Fairlight CMI?",answers:["Peter Gabriel","Art of Noise","New Order","Yazoo"],correct:1},
  {question:"Which Beatles song was banned by the BBC?",answers:["Lucy in the Sky with Diamonds","Day Tripper","A Day in the Life","Rain"],correct:2},
  {question:"Which 1980s guitarist played the solo on Michael Jackson's 'Beat It'?",answers:["Slash","Eddie Van Halen","Steve Lukather","Jeff Beck"],correct:1},
  {question:"Which Premier League team conceded fastest goal?",answers:["Aston Villa","Watford","Southampton","Bournemouth"],correct:2},
  {question:"Which 1960s producer is known for Wall of Sound?",answers:["Phil Spector","George Martin","Berry Gordy","Tom Wilson"],correct:0},
  {question:"Which 1980s synth-pop band released 'Architecture & Morality'?",answers:["OMD","Ultravox","Depeche Mode","Human League"],correct:0},
  {question:"Which Premier League club was deducted 9 points for administration?",answers:["Portsmouth","Leeds United","Bolton Wanderers","Wigan Athletic"],correct:0},
  {question:"Which Beatles track used tape loops by John Lennon?",answers:["Tomorrow Never Knows","Strawberry Fields","Penny Lane","Help!"],correct:0},
  {question:"Which 1980s singer had hit '99 Luftballons'?",answers:["Nena","Sabrina","Kim Wilde","Sandra"],correct:0}
];

// Shuffle and pick 12
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}
const selectedQuestions = shuffle([...questions]).slice(0,12);

let current = 0;
let score = 0;

function showQuestion(){
  if(current>=selectedQuestions.length){
    document.getElementById('quiz').style.display='none';
    const resultDiv=document.getElementById('result');
    resultDiv.style.display='block';
    resultDiv.innerHTML=`<h2>Quiz Complete!</h2><p>Your score: ${score} / ${selectedQuestions.length}</p>`;
    return;
  }
  const q=selectedQuestions[current];
  const quizDiv=document.getElementById('quiz');
  quizDiv.innerHTML=`<div class='question-block'>
  <div class='question'>${current+1}. ${q.question}</div>
  <div class='options'>${q.answers.map((a,i)=>`<label><input type='radio' name='q' value='${i}'>${a}</label>`).join('')}</div>
  <button id='nextBtn'>Next</button>
  </div>`;
  document.getElementById('nextBtn').onclick=()=>{
    const selected=document.querySelector('input[name=q]:checked');
    if(selected){
      if(parseInt(selected.value)===q.correct) score++;
      current++;
      showQuestion();
    }else{
      alert('Please select an answer');
    }
  };
}

// Auto-start quiz
showQuestion();
</script>
</body>
</html>
